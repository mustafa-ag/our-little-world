<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Our World" />
    <meta name="theme-color" content="#f4a6c0" />
    <!-- Use an absolute, versioned icon so iOS does not reuse an old shortcut icon. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-heart.png" />
    <link rel="icon" type="image/png" href="./icons/favicon.png" />
    <title>Our Little World (2D)</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #10131c;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #game canvas {
        display: block;
      }
      #try-3d {
        position: fixed;
        left: 50%;
        bottom: calc(6px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 10;
        padding: 5px 12px;
        border-radius: 999px;
        background: rgba(16, 19, 28, 0.72);
        border: 1px solid rgba(244, 166, 192, 0.8);
        color: #fff;
        font: 600 12px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
        text-decoration: none;
        letter-spacing: 0.02em;
        touch-action: manipulation;
      }
      #try-3d:hover,
      #try-3d:focus-visible {
        background: rgba(244, 166, 192, 0.9);
        color: #10131c;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <a id="try-3d" href="./">Try 3D Preview</a>
    <script type="module" src="/src/legacy2d.ts"></script>
  </body>
</html>
